<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login con Fondo</title>
    <link rel="stylesheet" href="principal.css">
</head>

<body>

    <!-- HEADER CON LOGO PRINCIPAL Y LINK A INICIO -->
    <header>
        <img src="descarga.png" alt="Logo Header" class="logo-header">
        <a href="bienvenida (3).html" class="home-link">
            <img src="logo.png" alt="Ir a inicio">
        </a>
    </header>

    <!-- CAPA OSCURA SOBRE FONDO -->
    <div class="overlay"></div>

    <!-- LOGIN FORM -->
    <div class="wrapper">
        <form action="">
            <img src="descarga.png" alt="Logo" class="logo">
            <h1>ᒪOGIᑎ</h1>
            <div class="input-box">
                <input type="text" placeholder="Username" required>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Password" required>
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit" class="btn">Login</button>
            <div class="register-link">
                <p>Don't have an account? <a href="#">Register</a></p>
            </div>
        </form>
    </div>

</body>

</html>
