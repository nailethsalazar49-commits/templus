<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Asistencia - Templus</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.4/dist/teachablemachine-image.min.js"></script>
  <script>
    const tmImage = window.tmImage;
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1d2e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Efecto de partículas de fondo */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 20% 50%, rgba(123, 97, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(123, 97, 255, 0.1) 0%, transparent 50%);
      animation: float 15s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    /* Partículas flotantes */
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(123, 97, 255, 0.5);
      border-radius: 50%;
      animation: particleFloat 8s ease-in-out infinite;
    }

    @keyframes particleFloat {
      0%, 100% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) translateX(50px);
        opacity: 0;
      }
    }

    .container {
      background: rgba(30, 33, 50, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 1;
      animation: slideIn 0.6s ease-out;
      border: 1px solid rgba(123, 97, 255, 0.2);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #7b61ff 0%, #a78bfa 100%);
      border-radius: 16px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 16px rgba(123, 97, 255, 0.4);
    }

    .logo::before {
      content: '👁️';
      font-size: 32px;
    }

    h2 {
      color: #ffffff;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #7b61ff 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #9ca3af;
      font-size: 14px;
    }

    .status-container {
      margin: 25px 0;
      padding: 16px;
      background: rgba(123, 97, 255, 0.1);
      border-radius: 12px;
      border-left: 4px solid #7b61ff;
    }

    #status {
      color: #e5e7eb;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #status::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7b61ff;
      animation: pulse 2s ease-in-out infinite;
    }

    #status.error::before {
      background: #f56565;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    .video-container {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
      border: 2px solid rgba(123, 97, 255, 0.3);
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
    }

    canvas {
      display: none;
    }

    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #7b61ff, transparent);
      animation: scan 2s linear infinite;
    }

    @keyframes scan {
      0% { transform: translateY(0); }
      100% { transform: translateY(240px); }
    }

    .corner {
      position: absolute;
      width: 30px;
      height: 30px;
      border: 3px solid #7b61ff;
      opacity: 0.8;
    }

    .corner.top-left {
      top: 15px;
      left: 15px;
      border-right: none;
      border-bottom: none;
    }

    .corner.top-right {
      top: 15px;
      right: 15px;
      border-left: none;
      border-bottom: none;
    }

    .corner.bottom-left {
      bottom: 15px;
      left: 15px;
      border-right: none;
      border-top: none;
    }

    .corner.bottom-right {
      bottom: 15px;
      right: 15px;
      border-left: none;
      border-top: none;
    }

    .info-card {
      background: rgba(30, 33, 50, 0.8);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(123, 97, 255, 0.2);
    }

    .info-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #7b61ff 0%, #a78bfa 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .info-content h3 {
      color: #e5e7eb;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .info-content p {
      color: #9ca3af;
      font-size: 12px;
    }

    /* Notificación toast */
    .toast {
      position: fixed;
      top: 30px;
      right: 30px;
      background: white;
      padding: 20px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      display: none;
      animation: slideInDown 0.4s ease-out;
      z-index: 1000;
      max-width: 400px;
      border-left: 4px solid #48bb78;
    }

    .toast.error {
      border-left-color: #f56565;
    }

    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-100px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .toast.show {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .toast-icon {
      font-size: 24px;
      flex-shrink: 0;
    }

    .toast-content h4 {
      color: #2d3748;
      font-size: 16px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .toast-content p {
      color: #718096;
      font-size: 14px;
      margin: 0;
    }

    .toast.success .toast-icon::before {
      content: '✅';
    }

    .toast.error .toast-icon::before {
      content: '❌';
    }

    .detection-badge {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: rgba(30, 33, 50, 0.95);
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: none;
      animation: slideInRight 0.4s ease-out;
      z-index: 999;
      border: 1px solid rgba(123, 97, 255, 0.3);
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(100px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .detection-badge.show {
      display: block;
    }

    .detection-badge h4 {
      color: #9ca3af;
      font-size: 12px;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .detection-badge p {
      color: #7b61ff;
      font-weight: 600;
      font-size: 18px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
      }

      h2 {
        font-size: 24px;
      }

      .toast {
        top: 20px;
        right: 20px;
        left: 20px;
        max-width: none;
      }

      .detection-badge {
        bottom: 20px;
        right: 20px;
      }
    }
  </style>
</head>
<body>
  <!-- Partículas decorativas -->
  <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
  <div class="particle" style="left: 25%; animation-delay: 2s;"></div>
  <div class="particle" style="left: 50%; animation-delay: 4s;"></div>
  <div class="particle" style="left: 75%; animation-delay: 1s;"></div>
  <div class="particle" style="left: 90%; animation-delay: 3s;"></div>

  <div class="container">
    <div class="header">
      <div class="logo"></div>
      <h2>Reconocimiento Facial</h2>
      <p class="subtitle">Sistema Automático de Asistencia</p>
    </div>

    <div class="status-container">
      <div id="status">Iniciando sistema...</div>
    </div>

    <div class="video-container">
      <video id="webcam" autoplay playsinline width="420" height="240"></video>
      <div class="scan-line"></div>
      <div class="corner top-left"></div>
      <div class="corner top-right"></div>
      <div class="corner bottom-left"></div>
      <div class="corner bottom-right"></div>
    </div>

    <canvas id="canvas" width="420" height="240"></canvas>

    <div class="info-card">
      <div class="info-icon">📊</div>
      <div class="info-content">
        <h3>Estado del Sistema</h3>
        <p>Detección automática activada</p>
      </div>
    </div>
  </div>

  <!-- Toast de notificación -->
  <div class="toast" id="toast">
    <div class="toast-icon"></div>
    <div class="toast-content">
      <h4 id="toastTitle">Título</h4>
      <p id="toastMessage">Mensaje</p>
    </div>
  </div>

  <!-- Badge de detección -->
  <div class="detection-badge" id="detectionBadge">
    <h4>Estudiante Detectado</h4>
    <p id="detectedStudent">---</p>
  </div>

  <script>
    const URL = "./tm-my-image-model/";
    const statusEl = document.getElementById("status");
    const detectionBadge = document.getElementById("detectionBadge");
    const detectedStudent = document.getElementById("detectedStudent");
    const toast = document.getElementById("toast");
    const toastTitle = document.getElementById("toastTitle");
    const toastMessage = document.getElementById("toastMessage");
    
    let lastDetection = "";
    let detectionTimeout;
    let registeredStudents = new Set(); // Para evitar registros duplicados

    function showStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = isError ? "error" : "";
      console.log(msg);
    }

    function showToast(title, message, isError = false) {
      toast.className = `toast ${isError ? 'error' : 'success'} show`;
      toastTitle.textContent = title;
      toastMessage.textContent = message;
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 4000);
    }

    function showDetection(studentName) {
      if (studentName !== lastDetection) {
        lastDetection = studentName;
        detectedStudent.textContent = studentName;
        detectionBadge.classList.add("show");
        
        clearTimeout(detectionTimeout);
        detectionTimeout = setTimeout(() => {
          detectionBadge.classList.remove("show");
        }, 3000);
      }
    }

    async function init() {
      try {
        if (typeof tmImage === "undefined") {
          showStatus("Error: Librería no cargada", true);
          console.log("window.tmImage =", window.tmImage);
          return;
        }
        if (typeof tmImage.load !== "function") {
          showStatus("Error: tmImage.load no existe", true);
          console.log("tmImage keys:", Object.keys(tmImage));
          return;
        }

        showStatus("Verificando modelo...");
        const [modelResp, metaResp] = await Promise.all([
          fetch(URL + "model.json"),
          fetch(URL + "metadata.json")
        ]);
        
        if (!modelResp.ok || !metaResp.ok) {
          showStatus(`Modelo no encontrado (${modelResp.status}, ${metaResp.status})`, true);
          return;
        }

        showStatus("Cargando modelo de IA...");
        const model = await tmImage.load(URL + "model.json", URL + "metadata.json");
        showStatus("Activando cámara...");

        const video = document.getElementById("webcam");
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        await new Promise(resolve => video.onloadeddata = resolve);
        
        showStatus("✓ Sistema activo - Reconociendo rostros");

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        async function loop() {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const prediction = await model.predict(canvas);
          const best = prediction.reduce((a, b) => a.probability > b.probability ? a : b);

          if (best && best.probability > 0.90) {
            const studentId = best.className;
            console.log("Detectado:", studentId, "prob:", best.probability);
            showDetection(studentId);
            
            // Verificar si ya fue registrado en esta sesión
            if (!registeredStudents.has(studentId)) {
              try {
                const response = await fetch("http://127.0.0.1/media_tecnica/MACHINE/registrar.php", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ estudiante: studentId })
                });
                
                const data = await response.json();
                
                if (data.status === "ok") {
                  registeredStudents.add(studentId);
                  showToast(
                    "✓ Registro Exitoso",
                    `Asistencia registrada para: ${studentId}`,
                    false
                  );
                  console.log("✓ Registro exitoso:", data);
                } else {
                  showToast(
                    "Error en el Registro",
                    data.msg || "No se pudo completar el registro",
                    true
                  );
                  console.error("Error en respuesta:", data);
                }
              } catch (error) {
                showToast(
                  "Error de Conexión",
                  "No se pudo conectar con el servidor",
                  true
                );
                console.error("Error al registrar:", error);
              }
            }
          }

          requestAnimationFrame(loop);
        }
        loop();

      } catch (err) {
        console.error(err);
        showStatus("Error: " + err.message, true);
        showToast("Error del Sistema", err.message, true);
      }
    }

    init();
  </script>
</body>
</html>
